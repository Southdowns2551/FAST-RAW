# Material Hub - nginx with HTTPS
# Certificates: ./ssl/cert.pem, ./ssl/key.pem (create with ssl/gen-cert.sh or certbot)

worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      try_files $uri =404;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $backend "http://api:3000";
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App shell must always revalidate; the service worker owns offline caching.
    # expires (rather than add_header) keeps the server-level security headers,
    # which a location containing any add_header would discard.
    location ~* \.(?:html|css|js|json)$ {
      expires -1;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
  }
}
