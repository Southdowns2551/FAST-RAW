# Material Hub PWA - reverse proxy
# Serves static files, proxies /api to backend

worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $backend "http://api:3000";
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sw.js {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      add_header Expires "0";
    }

    # App shell must always revalidate; the service worker owns offline caching.
    # expires (rather than add_header) keeps the server-level security headers,
    # which a location containing any add_header would discard.
    location ~* \.(?:html|css|js|json)$ {
      expires -1;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
  }
}
